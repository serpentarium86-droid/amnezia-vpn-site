<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnezia VPN — Скачать для Android</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.1em;
            color: #b8b8d4;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .features {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            flex-wrap: wrap;
            gap: 15px;
        }
        .feature {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            flex: 1;
            min-width: 120px;
        }
        .feature-icon { font-size: 24px; margin-bottom: 8px; }
        .feature-text { font-size: 0.9em; color: #b8b8d4; }
        .download-btn {
            display: inline-block;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            color: #fff;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            margin: 20px 0;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(123, 47, 247, 0.4);
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(123, 47, 247, 0.6);
        }
        .version-info {
            color: #8888aa;
            font-size: 0.9em;
            margin-top: 15px;
        }
        .footer {
            margin-top: 40px;
            color: #666688;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛡️</div>
        <h1>Amnezia VPN</h1>
        <p class="subtitle">Безопасный и бесплатный VPN для Android. Обходи блокировки и защищай свою приватность.</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Шифрование</div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-text">Быстрая скорость</div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-text">Бесплатно</div>
            </div>
        </div>
        
        <a id="download-link" class="download-btn" href="#">⬇️ Скачать APK</a>
        
        <p class="version-info" id="version-info">Загрузка информации о версии...</p>
        
        <div class="footer">
            <p>© 2026 Amnezia VPN • Android APK</p>
        </div>
    </div>
    
    <script>
        const repo = 'serpentarium86-droid/amnezia-vpn-site';
        const apiUrl = `https://api.github.com/repos/${repo}/releases/latest`;
        
        fetch(apiUrl)
            .then(r => r.json())
            .then(data => {
                if (data.assets && data.assets.length > 0) {
                    const apk = data.assets.find(a => a.name.endsWith('.apk')) || data.assets[0];
                    document.getElementById('download-link').href = apk.browser_download_url;
                    document.getElementById('version-info').textContent = 
                        `Версия: ${data.tag_name || 'latest'} • Размер: ${(apk.size / 1024 / 1024).toFixed(1)} МБ • Обновлено: ${new Date(data.published_at).toLocaleDateString('ru-RU')}`;
                } else {
                    document.getElementById('version-info').textContent = 'Релиз пока не опубликован';
                }
            })
            .catch(() => {
                document.getElementById('version-info').textContent = 'Не удалось загрузить информацию';
            });
    </script>
</body>
</html>
